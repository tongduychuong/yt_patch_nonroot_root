name: Check YouTube Best Supported Version

on:
  workflow_dispatch:
    inputs:
      update_version_file:
        description: "Update version.txt to the best stable supported version"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 23 * * *"

permissions:
  contents: write

env:
  MORPHE_REPO: MorpheApp/morphe-patches
  PATCHES_URL: https://raw.githubusercontent.com/MorpheApp/morphe-patches/main/patches-list.json
  VERSION_FILE: version.txt

jobs:
  check:
    name: Check YouTube support
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Read Morphe supported YouTube versions
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL --retry 5 "$PATCHES_URL" -o patches-list.json

          test -s patches-list.json
          jq -e '.version and .patches' patches-list.json >/dev/null

          # Collect every YouTube target declared by Morphe patches.
          jq -r '
            .patches[]
            | .compatiblePackages[]?
            | select(.packageName == "com.google.android.youtube")
            | .targets[]?
            | [.version, (.isExperimental // false)]
            | @tsv
          ' patches-list.json |
          sort -u > youtube_targets.tsv

          test -s youtube_targets.tsv

          # Best support:
          # 1. Prefer non-experimental versions.
          # 2. Among them, choose the newest semantic YouTube version.
          BEST_STABLE="$(
            awk -F '	' '$2 == "false" {print $1}' youtube_targets.tsv |
            sort -V |
            tail -n 1
          )"

          # Fallback to the newest experimental version if Morphe has no
          # non-experimental YouTube target.
          BEST_ANY="$(
            cut -f1 youtube_targets.tsv |
            sort -V |
            tail -n 1
          )"

          BEST_VERSION="${BEST_STABLE:-$BEST_ANY}"

          test -n "$BEST_VERSION"

          PATCH_VERSION="$(jq -r '.version' patches-list.json)"

          echo "MORPHE_PATCH_VERSION=$PATCH_VERSION" >> "$GITHUB_ENV"
          echo "BEST_YOUTUBE_VERSION=$BEST_VERSION" >> "$GITHUB_ENV"

          echo "Morphe patches: $PATCH_VERSION"
          echo "Best supported YouTube: $BEST_VERSION"

      - name: Check current version.txt
        shell: bash
        run: |
          set -euo pipefail

          CURRENT="$(tr -d '\r\n' < "$VERSION_FILE" | xargs || true)"

          if [ -z "$CURRENT" ]; then
            echo "VERSION_STATUS=EMPTY" >> "$GITHUB_ENV"
            echo "version.txt is empty."
            exit 0
          fi

          if awk -F '\t' -v v="$CURRENT" '$1 == v {found=1} END {exit !found}' youtube_targets.tsv; then
            IS_EXPERIMENTAL="$(
              awk -F '\t' -v v="$CURRENT" '$1 == v {print $2; exit}' youtube_targets.tsv
            )"

            if [ "$IS_EXPERIMENTAL" = "true" ]; then
              echo "VERSION_STATUS=EXPERIMENTAL" >> "$GITHUB_ENV"
              echo "Current YouTube $CURRENT is supported but EXPERIMENTAL."
            else
              echo "VERSION_STATUS=SUPPORTED" >> "$GITHUB_ENV"
              echo "Current YouTube $CURRENT is supported and stable."
            fi
          else
            echo "VERSION_STATUS=UNSUPPORTED" >> "$GITHUB_ENV"
            echo "Current YouTube $CURRENT is NOT supported by Morphe patches."
          fi

          echo "CURRENT_YOUTUBE_VERSION=$CURRENT" >> "$GITHUB_ENV"

      - name: Show result
        shell: bash
        run: |
          {
            echo "## YouTube / Morphe compatibility"
            echo
            echo "- Morphe patch: **${MORPHE_PATCH_VERSION}**"
            echo "- Best stable supported YouTube: **${BEST_YOUTUBE_VERSION}**"
            echo "- Current version.txt: **${CURRENT_YOUTUBE_VERSION:-empty}**"
            echo "- Status: **${VERSION_STATUS}**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update version.txt
        if: github.event_name == 'workflow_dispatch' && inputs.update_version_file == true
        shell: bash
        run: |
          set -euo pipefail

          printf '%s\n' "$BEST_YOUTUBE_VERSION" > "$VERSION_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$VERSION_FILE"

          if git diff --cached --quiet; then
            echo "version.txt already uses $BEST_YOUTUBE_VERSION"
            exit 0
          fi

          git commit -m "chore: use best supported YouTube version"
          git push
