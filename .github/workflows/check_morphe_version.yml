name: Check Morphe Max Supported YouTube Version

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # ============================================================
      # MAIN - Stable YouTube version
      # Source: Morphe main / patches-list.json
      # version.txt ALWAYS follows the latest stable version
      # ============================================================
      - name: Check Stable YouTube Version - Morphe Main
        shell: bash
        run: |
          python3 <<'PY' > main_output.txt
          import json
          import urllib.request
          import re
          import os

          URL = (
              "https://raw.githubusercontent.com/"
              "MorpheApp/morphe-patches/main/patches-list.json"
          )

          print(f"Checking Main: {URL}")

          req = urllib.request.Request(
              URL,
              headers={"User-Agent": "GitHub-Actions"}
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.loads(response.read().decode("utf-8"))

          versions = []

          def scan(obj):
              if isinstance(obj, dict):
                  package = str(
                      obj.get("packageName")
                      or obj.get("package")
                      or obj.get("name")
                      or ""
                  ).lower()

                  version = str(
                      obj.get("version") or ""
                  ).strip()

                  experimental = obj.get(
                      "experimental",
                      False
                  )

                  is_youtube = (
                      package == "com.google.android.youtube"
                      or "youtube" in package
                  )

                  if (
                      is_youtube
                      and version
                      and not experimental
                      and re.fullmatch(
                          r"\d+\.\d+\.\d+",
                          version
                      )
                  ):
                      versions.append(version)

                  for value in obj.values():
                      scan(value)

              elif isinstance(obj, list):
                  for value in obj:
                      scan(value)

          scan(data)

          versions = sorted(
              set(versions),
              key=lambda v: [
                  int(x) for x in v.split(".")
              ]
          )

          if not versions:
              raise RuntimeError(
                  "Không tìm thấy stable YouTube version "
                  "trên Morphe main."
              )

          stable_version = versions[-1]

          current_version = ""

          if os.path.exists("version.txt"):
              with open(
                  "version.txt",
                  "r",
                  encoding="utf-8"
              ) as f:
                  current_version = f.read().strip()

          # ALWAYS sync version.txt with stable version.
          if current_version != stable_version:
              with open(
                  "version.txt",
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(stable_version + "\n")

              changed = "true"
              status = "Updated"
          else:
              changed = "false"
              status = "Skip"

          print(f"VERSION_CHANGED_MAIN={changed}")
          print(f"NEW_VERSION_MAIN={stable_version}")
          print(f"CURRENT_VERSION_MAIN={current_version}")
          print(f"STATUS_MAIN={status}")
          PY

          cat main_output.txt

      # ============================================================
      # DEV - YouTube version
      # Source: Morphe dev / README.md
      # ============================================================
      - name: Check Dev YouTube Version - Morphe README
        shell: bash
        run: |
          python3 <<'PY' > dev_output.txt
          import urllib.request
          import re
          import os

          URL = (
              "https://raw.githubusercontent.com/"
              "MorpheApp/morphe-patches/dev/README.md"
          )

          print(f"Checking Dev: {URL}")

          req = urllib.request.Request(
              URL,
              headers={"User-Agent": "GitHub-Actions"}
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              readme = response.read().decode("utf-8")

          # Find YouTube section in README.
          match = re.search(
              r'(?is)'
              r'(?:^|\n)#+\s*YouTube\b'
              r'(.*?)(?=\n#+\s|\Z)',
              readme
          )

          if match:
              youtube_block = match.group(1)
          else:
              youtube_block = readme

          versions = set(
              re.findall(
                  r'\b\d{1,3}\.\d{1,3}\.\d{1,3}\b',
                  youtube_block
              )
          )

          # Ignore date-like versions.
          versions = [
              v for v in versions
              if not v.startswith(
                  ("2024.", "2025.", "2026.")
              )
          ]

          if not versions:
              raise RuntimeError(
                  "Không tìm thấy YouTube version "
                  "trong Morphe dev README.md"
              )

          dev_version = max(
              versions,
              key=lambda v: [
                  int(x) for x in v.split(".")
              ]
          )

          current_dev_version = ""

          if os.path.exists("version_dev.txt"):
              with open(
                  "version_dev.txt",
                  "r",
                  encoding="utf-8"
              ) as f:
                  current_dev_version = f.read().strip()

          if current_dev_version != dev_version:
              with open(
                  "version_dev.txt",
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(dev_version + "\n")

              changed = "true"
              status = "Updated"
          else:
              changed = "false"
              status = "Skip"

          print(f"VERSION_CHANGED_DEV={changed}")
          print(f"NEW_VERSION_DEV={dev_version}")
          print(f"CURRENT_VERSION_DEV={current_dev_version}")
          print(f"STATUS_DEV={status}")
          PY

          cat dev_output.txt

      # ============================================================
      # COMMIT
      # ============================================================
      - name: Commit and Push if Updated
        shell: bash
        run: |
          source main_output.txt
          source dev_output.txt

          MAIN_STATUS="Skip"
          DEV_STATUS="Skip"

          if [ "$VERSION_CHANGED_MAIN" = "true" ]; then
            MAIN_STATUS="$NEW_VERSION_MAIN"
          fi

          if [ "$VERSION_CHANGED_DEV" = "true" ]; then
            DEV_STATUS="$NEW_VERSION_DEV"
          fi

          if [ "$VERSION_CHANGED_MAIN" = "true" ] || \
             [ "$VERSION_CHANGED_DEV" = "true" ]; then

            git config --global user.name \
              "github-actions[bot]"

            git config --global user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git add version.txt version_dev.txt

            git commit -m \
              "build: update YouTube versions (main: $MAIN_STATUS, dev: $DEV_STATUS)"

            git push

            echo "========================================"
            echo "Version update completed"
            echo "Main: $MAIN_STATUS"
            echo "Dev : $DEV_STATUS"
            echo "========================================"

          else
            echo "========================================"
            echo "No version changes"
            echo "Main: Skip"
            echo "Dev : Skip"
            echo "========================================"
          fi

      # ============================================================
      # GITHUB ACTIONS SUMMARY
      # ============================================================
      - name: Summary
        shell: bash
        run: |
          source main_output.txt
          source dev_output.txt

          {
            echo "## Morphe YouTube Versions"
            echo
            echo "| Channel | Source | Current | Detected | Status |"
            echo "|---|---|---|---|---|"
            echo "| Stable | main/patches-list.json | \`$CURRENT_VERSION_MAIN\` | \`$NEW_VERSION_MAIN\` | $STATUS_MAIN |"
            echo "| Dev | dev/README.md | \`$CURRENT_VERSION_DEV\` | \`$NEW_VERSION_DEV\` | $STATUS_DEV |"
            echo
            echo "### Commit"
            echo
            echo "- Main: \`$([ "$VERSION_CHANGED_MAIN" = "true" ] && echo "$NEW_VERSION_MAIN" || echo "Skip")\`"
            echo "- Dev: \`$([ "$VERSION_CHANGED_DEV" = "true" ] && echo "$NEW_VERSION_DEV" || echo "Skip")\`"
          } >> "$GITHUB_STEP_SUMMARY"
