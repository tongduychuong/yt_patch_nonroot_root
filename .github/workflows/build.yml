name: Check & Auto Build Root Mount YouTube

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Ép Build thủ công (bỏ qua kiểm tra Patch)'
        type: boolean
        default: false
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: youtube-root-mount-build
  cancel-in-progress: false

jobs:
  check-updates:
    name: Check for New Morphe Patches
    runs-on: ubuntu-latest
    outputs:
      has_new_stable: ${{ steps.check_patches.outputs.has_new_stable }}
      has_new_dev: ${{ steps.check_patches.outputs.has_new_dev }}
      latest_stable_tag: ${{ steps.check_patches.outputs.latest_stable_tag }}
      latest_dev_tag: ${{ steps.check_patches.outputs.latest_dev_tag }}
      should_build: ${{ steps.check_patches.outputs.should_build }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.3.0

      - name: Check Stable & Dev Patches
        id: check_patches
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ inputs.force_build || false }}
        run: |
          chmod +x .github/scripts/check_patches.sh
          .github/scripts/check_patches.sh

  build-stable:
    name: Build YouTube Stable
    needs: check-updates
    if: ${{ needs.check-updates.outputs.has_new_stable == 'true' || inputs.force_build == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.3.0

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.10'

      - name: Set up Java JDK 21 & Tools
        uses: actions/setup-java@v4.7.0
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install p7zip & Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full zip jq
          BUILD_TOOLS_PATH=$(find "$ANDROID_HOME/build-tools/" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          echo "$BUILD_TOOLS_PATH" >> "$GITHUB_PATH"

      - name: Download Stable APK
        run: |
          VERSION=$(tr -d '\r\n' < version.txt | sed 's/^[vV]//' | xargs)
          if [ -z "$VERSION" ]; then
            echo "ERROR: version.txt is empty."
            exit 1
          fi
          echo "YT_VERSION=$VERSION" >> "$GITHUB_ENV"
          python .github/scripts/download_apk.py "$VERSION" "youtube.apk"

      - name: Download Tools & Resources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo MorpheApp/morphe-cli --pattern "*.jar" --clobber
          JAR_FILE=$(find . -maxdepth 1 -type f -name "*.jar" | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: Morphe CLI JAR not found."
            exit 1
          fi
          mv "$JAR_FILE" morphe-cli.jar

          PATCH_TAG="${{ needs.check-updates.outputs.latest_stable_tag }}"
          if [ -z "$PATCH_TAG" ] \vert{}\vert{} [ "$PATCH_TAG" = "null" ]; then
            echo "ERROR: Stable patch tag is empty."
            exit 1
          fi
          echo "PATCH_TAG=$PATCH_TAG" >> "$GITHUB_ENV"

          gh release download "$PATCH_TAG" --repo MorpheApp/morphe-patches --pattern "*.mpp" --clobber
          MPP_FILE=$(find . -maxdepth 1 -type f -name "*.mpp" | head -n 1)
          if [ -z "$MPP_FILE" ]; then
            echo "ERROR: Stable .mpp not found."
            exit 1
          fi
          mv "$MPP_FILE" patches.mpp

          mkdir -p bin_temp
          curl -fsSL https://github.com/j-hc/revanced-magisk-module/archive/refs/heads/main.tar.gz |
            tar -xz -C bin_temp --strip-components=1

          if [ -d "bin_temp/module/bin" ]; then
            cp -r bin_temp/module/bin ./bin
          else
            echo "WARNING: bin directory not found."
          fi

      - name: Restore or Generate KeyStore
        id: ks_setup
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash .github/scripts/setup_keystore.sh

      - name: Build & Package Stable Module
        run: bash .github/scripts/build_module.sh stable

      - name: Prepare Stable Release
        run: |
          mkdir -p release_files
          test -f "youtube_${YT_VERSION}.apk" || { echo "ERROR: Stable APK not found."; exit 1; }
          test -f "youtube_root_mount_${YT_VERSION}_Magisk.zip" || { echo "ERROR: Stable Magisk ZIP not found."; exit 1; }

          mv "youtube_${YT_VERSION}.apk" release_files/
          mv "youtube_root_mount_${YT_VERSION}_Magisk.zip" release_files/

          STABLE_TAG="${{ needs.check-updates.outputs.latest_stable_tag }}"
          cat > release_files/changelog.txt <<EOF
          ## 🚀 Morphe YouTube Stable Release

          📌 **YouTube Version:** \`${YT_VERSION}\`
          📌 **Stable Patch Version:** [$STABLE_TAG](https://github.com/MorpheApp/morphe-patches/releases/tag/$STABLE_TAG)

          ---

          📦 **Yêu cầu MicroG (dành cho bản APK Non-Root):** [MicroG-RE Releases](https://github.com/MorpheApp/MicroG-RE/releases)
          EOF

          echo "RELEASE_TAG=stable-${YT_VERSION}-$(date +'%Y%m%d-%H%M%S')-${RANDOM}" >> "$GITHUB_ENV"

      - name: Create Stable Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "YouTube Stable v${{ env.YT_VERSION }}"
          body_path: release_files/changelog.txt
          files: |
            release_files/*.apk
            release_files/*.zip
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # ─── CẬP NHẬT VÀO THƯ MỤC update/ ───
      - name: Update update.json & changelog.md for Stable
        run: |
          mkdir -p update
          VERSION_CODE=$(date +'%Y%m%d')

          cat <<EOF > update/update.json
          {
            "version": "${YT_VERSION}",
            "versionCode": ${VERSION_CODE},
            "zipUrl": "
