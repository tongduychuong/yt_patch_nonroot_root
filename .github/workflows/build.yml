name: Check & Auto Build Root Mount YouTube 

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Ép Build thủ công (bỏ qua kiểm tra Patch)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  build-and-release:
    name: Check, Build & Release YouTube Morphe
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.3.0

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.10'

      - name: Set up Java JDK 21 & Tools
        uses: actions/setup-java@v4.7.0
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install p7zip & Zip
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full zip
          BUILD_TOOLS_PATH=$(find $ANDROID_HOME/build-tools/ -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "$BUILD_TOOLS_PATH" >> $GITHUB_PATH

      - name: Check for New Patches
        id: check_patches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          # Chạy script check và lưu kết quả ra biến môi trường chung
          bash .github/scripts/check_patches.sh
          
          # Đọc các output từ file ghi tạm của GitHub (nếu script của bạn ghi vào $GITHUB_OUTPUT)
          # Hoặc gán trực tiếp để dùng trong job
          echo "FORCE_BUILD=${{ inputs.force_build }}" >> $GITHUB_ENV

      # ==========================================
      # 1. BUILD STABLE (Nếu có bản mới hoặc Force)
      # ==========================================
      - name: Build YouTube Stable
        if: ${{ env.HAS_NEW_STABLE == 'true' || inputs.force_build == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== BẮT ĐẦU BUILD STABLE ==="
          VERSION=$(cat version.txt | tr -d '\r\n' | sed 's/^[vV]//' | xargs)
          echo "YT_VERSION=$VERSION" >> $GITHUB_ENV
          
          # Tải APK Stable
          python .github/scripts/download_apk.py "$VERSION" "youtube_stable.apk"
          mv youtube_stable.apk youtube.apk

          # Tải công cụ & Patches
          gh release download --repo MorpheApp/morphe-cli --pattern "*.jar" --clobber
          mv $(ls *.jar | head -n 1) morphe-cli.jar

          PATCH_TAG="${{ env.LATEST_STABLE_TAG }}"
          gh release download "$PATCH_TAG" --repo MorpheApp/morphe-patches --pattern "*.mpp" --clobber
          mv $(ls *.mpp | head -n 1) patches.mpp

          mkdir -p bin_temp
          curl -sL https://github.com/j-hc/revanced-magisk-module/archive/refs/heads/main.tar.gz | tar -xz -C bin_temp --strip-components=1 || true

          # Thiết lập KeyStore & Build
          bash .github/scripts/setup_keystore.sh
          bash .github/scripts/build_module.sh stable

          # Đổi tên file gọn gàng để gom vào release
          mkdir -p release_files
          mv youtube_*.apk release_files/ 2>/dev/null || true
          mv youtube_*_Magisk.zip release_files/ 2>/dev/null || true
          rm -f youtube.apk morphe-cli.jar patches.mpp

      # ==========================================
      # 2. BUILD DEV (Nếu có bản mới hoặc Force)
      # ==========================================
      - name: Build YouTube Dev
        if: ${{ env.HAS_NEW_DEV == 'true' || inputs.force_build == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== BẮT ĐẦU BUILD DEV ==="
          VERSION_DEV=$(cat version_dev.txt | tr -d '\r\n' | sed 's/^[vV]//' | xargs)
          echo "YT_DEV_VERSION=$VERSION_DEV" >> $GITHUB_ENV
          
          # Tải APK Dev
          python .github/scripts/download_apk.py "$VERSION_DEV" "youtube_dev.apk"
          mv youtube_dev.apk youtube.apk

          # Tải công cụ & Patches
          gh release download --repo MorpheApp/morphe-cli --pattern "*.jar" --clobber
          mv $(ls *.jar | head -n 1) morphe-cli.jar

          PATCH_TAG_DEV="${{ env.LATEST_DEV_TAG }}"
          gh release download "$PATCH_TAG_DEV" --repo MorpheApp/morphe-patches --pattern "*.mpp" --clobber
          mv $(ls *.mpp | head -n 1) patches.mpp

          mkdir -p bin_temp
          curl -sL https://github.com/j-hc/revanced-magisk-module/archive/refs/heads/main.tar.gz | tar -xz -C bin_temp --strip-components=1 || true

          # Thiết lập KeyStore & Build
          bash .github/scripts/setup_keystore.sh
          bash .github/scripts/build_module.sh dev

          # Đổi tên file gom vào release
          mkdir -p release_files
          mv youtube_dev_*.apk release_files/ 2>/dev/null || true
          mv youtube_dev_*_Magisk.zip release_files/ 2>/dev/null || true
          rm -f youtube.apk morphe-cli.jar patches.mpp

      # ==========================================
      # 3. TẠO RELEASE & DỌN DẸP
      # ==========================================
      - name: Create Combined Release & Cleanup
        if: always() && hashFiles('release_files/*') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd release_files
          
          STABLE_TAG="${{ env.LATEST_STABLE_TAG }}"
          DEV_TAG="${{ env.LATEST_DEV_TAG }}"

          echo "## 🚀 Morphe YouTube Release Updates" > combined_changelog.txt
          echo "" >> combined_changelog.txt
          
          if [ -n "$STABLE_TAG" ] && [ "$STABLE_TAG" != "null" ]; then
            echo "📌 **Stable Patch Version:** [$STABLE_TAG](https://github.com/MorpheApp/morphe-patches/releases/tag/$STABLE_TAG)" >> combined_changelog.txt
          fi

          if [ -n "$DEV_TAG" ] && [ "$DEV_TAG" != "null" ]; then
            echo "🧪 **Dev Patch Version:** [$DEV_TAG](https://github.com/MorpheApp/morphe-patches/releases/tag/$DEV_TAG)" >> combined_changelog.txt
          fi

          echo "" >> combined_changelog.txt
          echo "---" >> combined_changelog.txt
          echo "📦 **Yêu cầu MicroG (dành cho bản APK Non-Root):** [MicroG-RE Releases](https://github.com/MorpheApp/MicroG-RE/releases)" >> combined_changelog.txt

          TAG_NAME="auto-build-$(date +'%Y.%m.%d-%H%M')"
          echo "RELEASE_TAG=$TAG_NAME" >> $GITHUB_ENV
          cd ..

          # Tạo GitHub Release
          gh release create "$TAG_NAME" \
            --title "YouTube Morphe Update ($TAG_NAME)" \
            --notes-file release_files/combined_changelog.txt \
            release_files/* || true

      - name: Delete Artifacts & Local Cleanup
        run: bash .github/scripts/cleanup_artifacts.sh || true

      - name: Cleanup Old Releases and Tags
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT || github.token }}
        run: |
          set -e
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}")

          curl -fsSL "${AUTH[@]}" "$API/releases?per_page=100" |
            jq -r 'sort_by(.published_at // .created_at) | reverse | .[10:][] | "\(.id)|\(.tag_name)"' |
            while IFS='|' read -r id tag; do
              [ -z "$id" ] && continue
              curl -fsSL -X DELETE "${AUTH[@]}" "$API/releases/$id"
              curl -s -X DELETE "${AUTH[@]}" "$API/git/refs/tags/$tag" >/dev/null || true
            done

      - name: Send Telegram Notification
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_CHAT_ID }}
        if: ${{ env.TELEGRAM_TOKEN != '' && env.TELEGRAM_TO != '' && env.RELEASE_TAG != '' }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🎉 *YouTube Morphe Build Thành Công!*
            
            🏷 *Release Tag:* `${{ env.RELEASE_TAG }}`
            
            🔗 [Xem Release & Tải File](https://github.com/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }})
            🛡 [Tải MicroG-RE](https://github.com/MorpheApp/MicroG-RE/releases)

      - name: Cleanup Old Workflow Runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Fetching workflow runs..."
          run_ids=$(gh run list --limit 100 --json databaseId -q '.[5:][].databaseId')
          for id in $run_ids; do
            gh run delete "$id" || true
          done
          echo "Cleanup completed!"
